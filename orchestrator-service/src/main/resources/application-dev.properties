server.port=${ORCHESTRATOR_SERVICE_PORT:8080}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/aegis_orchestrator_db
spring.datasource.username=${ORCHESTRATOR_POSTGRES_USERNAME}
spring.datasource.password=${ORCHESTRATOR_POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate

spring.rabbitmq.host=${AEGIS_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${AEGIS_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${AEGIS_RABBITMQ_USERNAME}
spring.rabbitmq.password=${AEGIS_RABBITMQ_PASSWORD}

spring.mvc.problemdetails.enabled=true
