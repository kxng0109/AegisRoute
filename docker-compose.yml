services:
  ledger-db:
    image: postgres:alpine
    container_name: aegis_ledger_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${LEDGER_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${LEDGER_POSTGRES_PASSWORD}
      POSTGRES_DB: aegis_ledger_db
    volumes:
      - aegis_ledger_data:/var/lib/postgresql/data
    networks:
      - aegis_net

  orchestrator-db:
    image: postgres:alpine
    container_name: aegis_orchestrator_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${ORCHESTRATOR_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${ORCHESTRATOR_POSTGRES_PASSWORD}
      POSTGRES_DB: aegis_orchestrator_db
    volumes:
      - aegis_orchestrator_data:/var/lib/postgresql/data
    networks:
      - aegis_net

  gateway-cache:
    image: redis:alpine
    container_name: aegis_redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aegis_redis_data:/data
    networks:
      - aegis_net

  message-broker:
    image: rabbitmq:3-management-alpine
    container_name: aegis_message_broker
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${AEGIS_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${AEGIS_RABBITMQ_PASSWORD}
    volumes:
      - aegis_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - aegis_net

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: aegis_tracing_zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - aegis_net

  prometheus:
    image: prom/prometheus:latest
    container_name: aegis_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - aegis_net

  grafana:
    image: grafana/grafana:latest
    container_name: aegis_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - aegis_net

networks:
  aegis_net:
    driver: bridge

volumes:
  aegis_ledger_data:
    name: aegis_ledger_data
  aegis_orchestrator_data:
    name: aegis_orchestrator_data
  aegis_redis_data:
    name: aegis_redis_data
  aegis_rabbitmq_data:
    name: aegis_rabbitmq_data