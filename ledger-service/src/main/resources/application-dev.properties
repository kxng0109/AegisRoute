server.port=${LEDGER_SERVICE_PORT:8082}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/aegis_ledger_db
spring.datasource.username=${LEDGER_POSTGRES_USERNAME}
spring.datasource.password=${LEDGER_POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.properties.jakarta.persistence.lock.timeout=3000
spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=${AEGIS_REDIS_HOST:localhost}
spring.data.redis.port=${AEGIS_REDIS_PORT:6379}

spring.rabbitmq.host=${AEGIS_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${AEGIS_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${AEGIS_RABBITMQ_USERNAME}
spring.rabbitmq.password=${AEGIS_RABBITMQ_PASSWORD}

spring.mvc.problemdetails.enabled=true

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

jdbc.datasource-proxy.query.enable-logging=true